services:

  app:
    image: ghcr.io/saeid7k/artconsole/artconsole-app:latest
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/www/artconsole/storage/app/public:/var/www/html/storage/app/public
      - /var/www/artconsole/public/drive:/var/www/html/public/drive
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - artconsole

  nginx:
    image: ghcr.io/saeid7k/artconsole/artconsole-nginx:latest
    environment:
      APP_DOMAIN: "${APP_DOMAIN}"
    volumes:
      - /var/www/artconsole/storage/app/public:/var/www/html/storage/app/public:ro
      - /var/www/artconsole/public/drive:/var/www/html/public/drive:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.artconsole.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.artconsole.entrypoints=websecure"
      - "traefik.http.routers.artconsole.tls.certresolver=le"
      - "traefik.http.services.artconsole.loadbalancer.server.port=80"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - artconsole
      - proxy

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - artconsole

  queue:
    image: ghcr.io/saeid7k/artconsole/artconsole-app:latest
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--timeout=600", "--max-time=3600"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      SKIP_BOOTSTRAP: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/www/artconsole/storage/app/public:/var/www/html/storage/app/public
      - /var/www/artconsole/public/drive:/var/www/html/public/drive
    depends_on:
      - app
      - redis
    restart: unless-stopped
    networks:
      - artconsole

  scheduler:
    image: ghcr.io/saeid7k/artconsole/artconsole-app:latest
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      SKIP_BOOTSTRAP: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/www/artconsole/storage/app/public:/var/www/html/storage/app/public
      - /var/www/artconsole/public/drive:/var/www/html/public/drive
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - artconsole

  pulse:
    image: ghcr.io/saeid7k/artconsole/artconsole-app:latest
    command: ["php", "artisan", "pulse:work"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      SKIP_BOOTSTRAP: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
      - redis
    restart: unless-stopped
    networks:
      - artconsole

networks:
  artconsole:
    driver: bridge
  proxy:
    external: true

volumes:
  redis_data:
