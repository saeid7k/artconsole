upload_max_filesize = 100M
post_max_size       = 100M
max_execution_time  = 120
max_input_time      = 120
memory_limit        = 256M
expose_php          = Off
display_errors      = Off
log_errors          = On
error_log           = /var/www/html/storage/logs/php_errors.log
date.timezone       = UTC
session.gc_maxlifetime = 7200
