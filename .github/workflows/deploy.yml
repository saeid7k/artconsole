name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ghcr.io/${{ github.repository }}/artconsole-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: nginx-prod
          push: true
          tags: ghcr.io/${{ github.repository }}/artconsole-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy Files to Production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: "/var/www/artconsole"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: |
            set -e
            cd /var/www/artconsole

            echo "▶ Authenticating with GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "▶ Pulling latest code..."
            git pull --rebase --force origin main

            echo "▶ Pulling new images..."
            docker compose --env-file .env.production -f docker-compose.prod.yml pull

            echo "▶ Swapping containers..."
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --no-build --remove-orphans

            echo "▶ Cleaning up..."
            docker image prune -a -f

            echo "✅ Deployment complete."
