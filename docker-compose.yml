services:

  app:
    build:
      context: .
      target: base
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - artconsole

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - artconsole

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - artconsole

  queue:
    build:
      context: .
      target: base
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--timeout=90"]
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
      - redis
    restart: unless-stopped
    networks:
      - artconsole

  scheduler:
    build:
      context: .
      target: base
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - artconsole

  vite:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "yarn install --frozen-lockfile && yarn dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules_data:/app/node_modules
    networks:
      - artconsole

networks:
  artconsole:
    driver: bridge

volumes:
  redis_data:
  vendor_data:
  node_modules_data:
